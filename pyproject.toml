[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gitfile"
version = "0.2.0"
description = "One patch per file for projects that track an upstream commit"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HSGamer" }]
keywords = ["patches", "quilt", "upstream", "fork"]

[project.scripts]
gitfile = "gitfile:main"

[tool.setuptools]
py-modules = ["gitfile"]
